<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MediKiosk</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <div class="brand-icon">+</div>
      <span>MediKiosk</span>
    </a>
    <div class="nav-wrapper">
      <nav></nav>
      <button class="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode"></button>
    </div>
  </header>

  <main class="home-shell" style="max-width: 400px; margin: 40px auto; display: block;">
    <section class="hero" style="grid-template-columns: 1fr;">
      <div style="width: 100%;">
        <h2>Login</h2>
        <form id="login-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
          <input type="text" id="username" placeholder="Username" required style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg);" />
          <input type="password" id="password" placeholder="Password" required style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg);" />
          <button type="submit" class="button primary" style="width: 100%; border: none; cursor: pointer;">Login</button>
        </form>
        <p style="margin-top: 1rem; text-align: center;">
          Don't have an account? <a href="/register" style="color: var(--accent);">Register here</a>
        </p>
        <p id="error-msg" style="color: red; margin-top: 1rem; text-align: center;"></p>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (response.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));
          window.location.href = data.user.role === "patient" ? "/patient" : "/doctor";
        } else {
          errorMsg.textContent = data.error || "Login failed.";
        }
      } catch (error) {
        errorMsg.textContent = "Server error. Please try again.";
      }
    });
  </script>
</body>
</html>
