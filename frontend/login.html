<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MediKiosk</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
  <script src="/js/auth.js"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg-base);
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 1.8rem;
    }
    .auth-logo .brand-icon {
      width: 40px; height: 40px; font-size: 1.4rem;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    .auth-logo span { font-size: 1.4rem; font-weight: 700; color: var(--ink-primary); }
    .auth-title {
      text-align: center;
      margin-bottom: 0.3rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ink-primary);
    }
    .auth-subtitle {
      text-align: center;
      color: var(--ink-secondary);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .field-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink-secondary);
    }
    .field-input-wrap { position: relative; }
    .field-input-wrap svg {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--ink-muted);
      pointer-events: none;
    }
    .field-input {
      width: 100%;
      padding: 0.75rem 0.85rem 0.75rem 2.6rem;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--bg-base);
      color: var(--ink-primary);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .field-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .eye-toggle {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--ink-muted); padding: 0; display: flex;
    }
    .auth-btn {
      margin-top: 0.5rem;
      width: 100%;
      padding: 0.8rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .auth-btn:hover { background: var(--primary-hover); }
    .auth-btn:active { transform: scale(0.98); }
    .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .auth-divider {
      text-align: center;
      margin: 1.2rem 0 0.5rem;
      color: var(--ink-muted);
      font-size: 0.85rem;
    }
    .auth-link { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-link:hover { text-decoration: underline; }
    .error-banner {
      display: none;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.9rem;
      font-size: 0.88rem;
      margin-top: 0.5rem;
    }
    .error-banner.visible { display: block; }
    .role-pills {
      display: flex; gap: 0.6rem; margin-top: 0.2rem;
    }
    .role-pill {
      flex: 1; padding: 0.65rem; border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-sm); text-align: center;
      cursor: pointer; font-size: 0.88rem; font-weight: 600;
      color: var(--ink-secondary); background: var(--bg-base);
      transition: all 0.2s;
    }
    .role-pill:hover { border-color: var(--primary); color: var(--primary); }
    .role-pill.selected {
      border-color: var(--primary); background: var(--primary-light);
      color: var(--primary);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <div class="brand-icon">+</div>
      <span>MediKiosk</span>
    </a>
    <div class="nav-wrapper">
      <nav></nav>
      <button class="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode"></button>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-icon">+</div>
        <span>MediKiosk</span>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <form id="login-form" class="auth-form" novalidate>
        <div class="field-group">
          <label for="username">Username</label>
          <div class="field-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <input class="field-input" type="text" id="username" placeholder="Enter your username" required autocomplete="username">
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="field-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <input class="field-input" type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div id="error-banner" class="error-banner"></div>

        <button type="submit" class="auth-btn" id="submitBtn">Sign In</button>
      </form>

      <p class="auth-divider">
        Don't have an account? <a href="/register" class="auth-link">Create one</a>
      </p>
    </div>
  </div>

  <script>
    // Password toggle
    document.getElementById("eyeToggle").addEventListener("click", () => {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    });

    function showError(msg) {
      const banner = document.getElementById("error-banner");
      banner.textContent = msg;
      banner.classList.add("visible");
    }
    function clearError() {
      document.getElementById("error-banner").classList.remove("visible");
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("submitBtn");

      if (!username || !password) {
        showError("Please fill in all fields.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));
          window.location.href = data.user.role === "patient" ? "/patient" : "/doctor";
        } else {
          showError(data.error || "Login failed. Please check your credentials.");
          btn.disabled = false;
          btn.textContent = "Sign In";
        }
      } catch (error) {
        showError("Network error. Please try again.");
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
