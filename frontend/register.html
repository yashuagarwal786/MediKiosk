<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | MediKiosk</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
  <script src="/js/auth.js"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg-base);
      position: relative;
      overflow: hidden;
    }

    .auth-page::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent-blue));
      opacity: 0.06;
      top: -150px;
      right: -150px;
      animation: gradientBlob 10s ease infinite;
    }

    .auth-page::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), var(--primary));
      opacity: 0.04;
      bottom: -100px;
      left: -100px;
      animation: gradientBlob 8s ease infinite reverse;
    }

    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 1.8rem;
    }

    .auth-logo .brand-icon {
      width: 40px; height: 40px; font-size: 1.4rem;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent-blue));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .auth-logo span { font-size: 1.4rem; font-weight: 700; color: var(--ink-primary); }
    .auth-title { text-align: center; margin-bottom: 0.3rem; font-size: 1.5rem; font-weight: 700; color: var(--ink-primary); }
    .auth-subtitle { text-align: center; color: var(--ink-secondary); font-size: 0.9rem; margin-bottom: 2rem; }
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .field-group label { font-size: 0.85rem; font-weight: 600; color: var(--ink-secondary); }
    .field-input-wrap { position: relative; }
    .field-input-wrap svg {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--ink-muted); pointer-events: none;
    }
    .field-input {
      width: 100%;
      padding: 0.75rem 0.85rem 0.75rem 2.6rem;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-base);
      color: var(--ink-primary);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
      box-sizing: border-box;
    }
    .field-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .field-input.valid { border-color: var(--success); }
    .field-input.invalid { border-color: var(--danger); }
    .eye-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--ink-muted); padding: 0; display: flex;
    }
    .password-strength {
      display: flex; gap: 4px; margin-top: 6px;
    }
    .strength-bar {
      flex: 1; height: 4px; border-radius: 2px;
      background: var(--border-subtle); transition: background 0.3s;
    }
    .strength-bar.weak { background: var(--danger); }
    .strength-bar.medium { background: var(--warning); }
    .strength-bar.strong { background: var(--success); }
    .strength-hint { font-size: 0.78rem; color: var(--ink-muted); margin-top: 4px; }
    .role-pills { display: flex; gap: 0.6rem; }
    .role-pill {
      flex: 1; padding: 0.8rem 0.5rem; border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md); text-align: center; cursor: pointer;
      font-size: 0.9rem; font-weight: 600; color: var(--ink-secondary);
      background: var(--bg-base); transition: all 0.2s; user-select: none;
    }
    .role-pill:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
    .role-pill.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .role-pill .pill-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    .auth-btn {
      margin-top: 0.5rem; width: 100%; padding: 0.8rem;
      background: linear-gradient(135deg, var(--primary), #0d9e9f);
      color: #fff; border: none;
      border-radius: var(--radius-md); font-size: 1rem; font-weight: 650;
      cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .auth-btn:hover { background: linear-gradient(135deg, var(--primary-hover), var(--primary)); box-shadow: 0 6px 20px var(--primary-glow); transform: translateY(-2px); }
    .auth-btn:active { transform: scale(0.98); }
    .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .auth-divider { text-align: center; margin-top: 1.2rem; color: var(--ink-muted); font-size: 0.85rem; }
    .auth-link { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-link:hover { text-decoration: underline; }
    .error-banner {
      display: none; background: var(--danger-bg); border: 1px solid var(--danger-border);
      color: var(--danger); border-radius: var(--radius-md); padding: 0.65rem 0.9rem;
      font-size: 0.88rem; animation: fadeIn 0.3s ease;
    }
    .error-banner.visible { display: block; }
    .success-banner {
      display: none; background: var(--success-bg); border: 1px solid var(--success-border);
      color: var(--success); border-radius: var(--radius-md); padding: 0.65rem 0.9rem;
      font-size: 0.88rem; animation: fadeIn 0.3s ease;
    }
    .success-banner.visible { display: block; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <div class="brand-icon">+</div>
      <span>MediKiosk</span>
    </a>
    <div class="nav-wrapper">
      <nav></nav>
      <button class="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode"></button>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-icon">+</div>
        <span>MediKiosk</span>
      </div>
      <h1 class="auth-title">Create an account</h1>
      <p class="auth-subtitle">Join MediKiosk to manage your health records</p>

      <form id="register-form" class="auth-form" novalidate>

        <div class="field-group">
          <label>I am a</label>
          <div class="role-pills">
            <div class="role-pill selected" data-role="patient" id="pill-patient">
              <span class="pill-icon">🏥</span> Patient
            </div>
            <div class="role-pill" data-role="doctor" id="pill-doctor">
              <span class="pill-icon">👨‍⚕️</span> Doctor
            </div>
          </div>
          <input type="hidden" id="role" value="patient">
        </div>

        <div class="field-group">
          <label for="username">Username</label>
          <div class="field-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <input class="field-input" type="text" id="username" placeholder="Choose a username (min 3 chars)" required autocomplete="username">
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="field-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <input class="field-input" type="password" id="password" placeholder="Min 8 chars, 1 uppercase, 1 special" required autocomplete="new-password">
            <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Toggle visibility">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
          <div class="password-strength">
            <div class="strength-bar" id="bar1"></div>
            <div class="strength-bar" id="bar2"></div>
            <div class="strength-bar" id="bar3"></div>
            <div class="strength-bar" id="bar4"></div>
          </div>
          <div class="strength-hint" id="strengthHint">Use 8+ chars, one uppercase (A-Z) and one special character (!@#...)</div>
        </div>

        <div id="error-banner" class="error-banner"></div>
        <div id="success-banner" class="success-banner"></div>

        <button type="submit" class="auth-btn" id="submitBtn">Create Account</button>
      </form>

      <p class="auth-divider">
        Already have an account? <a href="/login" class="auth-link">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    const rolePills = document.querySelectorAll(".role-pill");
    const roleInput = document.getElementById("role");
    rolePills.forEach(pill => {
      pill.addEventListener("click", () => {
        rolePills.forEach(p => p.classList.remove("selected"));
        pill.classList.add("selected");
        roleInput.value = pill.dataset.role;
      });
    });

    document.getElementById("eyeToggle").addEventListener("click", () => {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    });

    function getStrength(pw) {
      let score = 0;
      if (pw.length >= 8) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pw)) score++;
      if (pw.length >= 12) score++;
      return score;
    }

    document.getElementById("password").addEventListener("input", (e) => {
      const pw = e.target.value;
      const score = getStrength(pw);
      const bars = ["bar1","bar2","bar3","bar4"];
      const cls = score <= 1 ? "weak" : score <= 2 ? "medium" : "strong";
      const labels = ["", "Weak", "Fair", "Strong", "Very Strong"];
      bars.forEach((id, i) => {
        const bar = document.getElementById(id);
        bar.className = "strength-bar" + (i < score ? ` ${cls}` : "");
      });
      document.getElementById("strengthHint").textContent = pw.length === 0
        ? "Use 8+ chars, one uppercase (A-Z) and one special character (!@#...)"
        : labels[score] || "Weak";
    });

    const usernameInput = document.getElementById("username");
    usernameInput.addEventListener("input", (e) => {
      e.target.classList.remove("valid", "invalid");
      if (e.target.value.trim().length >= 3) e.target.classList.add("valid");
    });

    function showError(msg) {
      const b = document.getElementById("error-banner");
      b.textContent = msg; b.classList.add("visible");
      document.getElementById("success-banner").classList.remove("visible");
    }
    function showSuccess(msg) {
      const b = document.getElementById("success-banner");
      b.textContent = msg; b.classList.add("visible");
      document.getElementById("error-banner").classList.remove("visible");
    }
    function clearMessages() {
      document.getElementById("error-banner").classList.remove("visible");
      document.getElementById("success-banner").classList.remove("visible");
    }

    function validatePassword(pw) {
      if (pw.length < 8) return "Password must be at least 8 characters.";
      if (!/[A-Z]/.test(pw)) return "Password must contain at least one uppercase letter.";
      if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pw)) return "Password must contain at least one special character (!@#$%...).";
      return null;
    }

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessages();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;
      const btn = document.getElementById("submitBtn");

      if (!username) { showError("Please enter a username."); return; }
      if (username.length < 3) { showError("Username must be at least 3 characters."); return; }

      const pwError = validatePassword(password);
      if (pwError) { showError(pwError); return; }

      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          showSuccess("Account created! Redirecting to login...");
          setTimeout(() => { window.location.href = "/login"; }, 1200);
        } else {
          showError(data.error || "Registration failed.");
          btn.disabled = false;
          btn.textContent = "Create Account";
        }
      } catch (error) {
        showError("Network error. Please try again.");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
